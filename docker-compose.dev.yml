# Минимальный docker-compose только для БД
# Запуск: docker-compose -f docker-compose.dev.yml up -d
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: unekov_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: osintbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unekov_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data_dev:
