version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: unekov_bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unekov_net

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: unekov_api
    restart: unless-stopped
    env_file: .env
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - unekov_net

  db:
    image: postgres:16-alpine
    container_name: unekov_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: osintbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - unekov_net

  redis:
    image: redis:7-alpine
    container_name: unekov_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - unekov_net

  nginx:
    image: nginx:alpine
    container_name: unekov_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - unekov_net

volumes:
  pg_data:
  redis_data:

networks:
  unekov_net:
    driver: bridge
